plugins {
    id 'java-library'
    id 'com.cleanroommc.cleanroomgradle'
}

// Every platform version comes from platform.json; nothing is pinned anywhere else.
ext.platform = new groovy.json.JsonSlurper().parse(file('platform.json'))
ext.cleanroom_version = platform.cleanroom.version
if (platform.schema != 1) {
    throw new GradleException('platform.json has an unknown schema.')
}
if (!(platform.graphics.driver?.floorBranch instanceof Integer) || !(platform.graphics.driver?.warnBelowBranch instanceof Integer)
        || !(platform.graphics.driver?.knownBad instanceof List)) {
    throw new GradleException('platform.json names no driver floor (graphics.driver: floorBranch, warnBelowBranch, knownBad).')
}
if (System.getProperty('java.runtime.version') != platform.java.runtimeVersion ||
        System.getProperty('java.vendor') != platform.java.vendor) {
    throw new GradleException("Run Gradle with ${platform.java.vendor} ${platform.java.runtimeVersion}; " +
        "observed ${System.getProperty('java.vendor')} ${System.getProperty('java.runtime.version')}.")
}

group = 'cc.orthrus.quadrature'
version = mod_version
base.archivesName = 'quadrature'

allprojects {
    repositories { mavenCentral() }
    plugins.withId('java') {
        java.toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.platform.java.major as int)
            vendor = JvmVendorSpec.ADOPTIUM
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = rootProject.platform.java.major as int
            options.compilerArgs.addAll(['-Xlint:all,-processing,-serial'])
        }
    }
}

java {
    withSourcesJar()
}

evaluationDependsOn(':core')

ext.cubaturePin = file("pins/${platform.cubature.jar}")
ext.orthlibPin = file("pins/${platform.orthlib.jar}")
ext.sha256Of = { File file ->
    java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
}

// The bridge to OrthLib's render interface (PLAN item P3-B2): OrthLib's classes are Java 26's, which Java 25's compiler
// reads only with a warning a class, so the few classes that implement its interface are compiled by Java 26's compiler,
// for Java 25 like the rest, and loaded only where OrthLib is installed (D26).
sourceSets {
    // Its sources lie where Gradle looks for a source set of this name: src/orthlib/java.
    orthlib
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version)
    implementation project(':core')
    // Cubature's public API, for the cube source. Compile only: Cubature supplies it at runtime.
    // The JAR is pinned in platform.json by commit and hash and kept in pins/, which is not in the
    // repository. Instances are prepared with the same file, so the build and the game read one JAR.
    compileOnly files(cubaturePin)
    orthlibCompileOnly sourceSets.main.output
    orthlibCompileOnly files(orthlibPin)
}
// The bridge sees everything the mod compiles against.
configurations.orthlibCompileOnly.extendsFrom(configurations.compileClasspath)

tasks.named('compileOrthlibJava') {
    def orthlibJava = platform.orthlibJava
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(orthlibJava.major as int)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    // Class files for the platform's Java, as every other class of the mod's.
    options.release = platform.java.major as int
    dependsOn 'verifyOrthLib'
}

// The pinned OrthLib JAR is checked when the bridge compiles against it, as Cubature's is.
tasks.register('verifyOrthLib') {
    def pin = platform.orthlib
    def jar = orthlibPin
    inputs.property('pinned', pin.sha256)
    doLast {
        if (!jar.exists()) {
            throw new GradleException("OrthLib's pinned JAR is missing at ${jar}. Run ./gradlew refreshOrthLib " +
                "to build it at commit ${pin.commit}.")
        }
        def found = sha256Of(jar)
        if (found != pin.sha256) {
            throw new GradleException("${jar} has sha256 ${found}; platform.json pins ${pin.sha256}. Run " +
                "./gradlew refreshOrthLib to build the pinned commit, or record the new commit and hash in " +
                "platform.json.")
        }
    }
}

// Builds the OrthLib JAR for pins/ at the commit platform.json pins (-PorthlibCommit to move the pin), from the
// sibling checkout (or -PorthlibCheckout), in a worktree of that checkout that is removed after, on the Java that
// platform.json names for OrthLib. Prints the commit, JAR name and hash to record in platform.json.
tasks.register('refreshOrthLib') {
    def pin = platform.orthlib
    def bridge = platform.orthlibJava
    def named = providers.gradleProperty('orthlibCheckout').map { file(it) }
    def root = rootDir
    def wanted = providers.gradleProperty('orthlibCommit').getOrElse(pin.commit)
    def scratch = layout.buildDirectory.dir('orthlib-pin').get().asFile
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(bridge.major as int)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    def pins = file('pins')
    doLast {
        def javaHome = launcher.get().metadata.installationPath.asFile
        def runtime = launcher.get().metadata.javaRuntimeVersion
        if (runtime != bridge.runtimeVersion) {
            throw new GradleException("The Java ${bridge.major} toolchain found is ${runtime}; platform.json names " +
                "${bridge.runtimeVersion}.")
        }
        def common = new ProcessBuilder('git', '-C', root.path, 'rev-parse', '--path-format=absolute', '--git-common-dir')
            .start()
        def commonDir = common.inputStream.text.trim()
        def checkout = named.getOrElse(new File(common.waitFor() == 0 ? new File(commonDir).parentFile : root, '../OrthLib')
            .canonicalFile)
        def git = { Object... arguments ->
            // Long paths on: a sibling's deepest files can pass Windows' 260-character limit in a worktree.
            def command = (['git', '-c', 'core.longpaths=true', '-C', checkout.path] + arguments.toList())*.toString()
            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def text = process.inputStream.text.trim()
            [process.waitFor(), text]
        }
        def (found, commit) = git('rev-parse', '--verify', "${wanted}^{commit}")
        if (found != 0) {
            throw new GradleException("${checkout} has no commit ${wanted}: fetch it there first.")
        }
        scratch.listFiles()?.findAll { it.isDirectory() }?.each { it.deleteDir() }
        git('worktree', 'prune')
        def work = new File(scratch, "${commit.take(12)}-${ProcessHandle.current().pid()}")
        scratch.mkdirs()
        def log = new File(scratch, "${commit.take(12)}.log")
        log.text = ''
        def (added, addText) = git('worktree', 'add', '--detach', work.path, commit)
        if (added != 0) { throw new GradleException("git worktree add failed: ${addText}") }
        try {
            def gradlew = new File(work, System.getProperty('os.name').startsWith('Windows') ? 'gradlew.bat' : 'gradlew')
            def builder = new ProcessBuilder([gradlew.path, 'assemble', '--no-daemon', '--no-watch-fs', '--console=plain',
                    "-Porg.gradle.java.installations.paths=${javaHome}"]*.toString())
                .directory(work).redirectErrorStream(true)
            builder.redirectOutput(ProcessBuilder.Redirect.appendTo(log))
            builder.environment().put('JAVA_HOME', javaHome.path)
            builder.environment().put('ORTHLIB_JAVA_HOME', javaHome.path)
            def code = builder.start().waitFor()
            if (code != 0) { throw new GradleException("OrthLib's build failed in ${work} (exit ${code}); see ${log}") }
            def built = new File(work, 'build/libs').listFiles().findAll { it.name ==~ /orthlib-[^-]+(-dev)?\.jar/ }
            if (built.size() != 1) { throw new GradleException("Expected one OrthLib JAR in the build, found ${built}") }
            def version = (built[0].name =~ /^orthlib-(.+)\.jar$/)[0][1]
            def name = "orthlib-${version}-${commit.take(8)}.jar"
            def jar = new File(pins, name)
            pins.mkdirs()
            java.nio.file.Files.copy(built[0].toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            def hash = sha256Of(jar)
            logger.lifecycle("Built ${jar}\n  commit ${commit}\n  jar ${name}\n  sha256 ${hash}")
            logger.lifecycle(commit == pin.commit && hash == pin.sha256 && name == pin.jar ? 'This is what platform.json pins.'
                : "platform.json pins ${pin.jar} at commit ${pin.commit}, sha256 ${pin.sha256}: record the values above " +
                    'there to build against this JAR.')
        } finally {
            if (work.exists()) { git('worktree', 'remove', '--force', work.path) }
            git('worktree', 'prune')
            if (work.exists() && !work.deleteDir()) { logger.lifecycle("Could not remove ${work} yet; a later run sweeps it.") }
        }
    }
}

// The pinned Cubature JAR is checked when something compiles against it, not when the build is
// configured, so that refreshCubature can run while it is missing or out of date.
tasks.register('verifyCubature') {
    def pin = platform.cubature
    def jar = cubaturePin
    inputs.property('pinned', pin.sha256)
    doLast {
        if (!jar.exists()) {
            throw new GradleException("Cubature's pinned JAR is missing at ${jar}. Run ./gradlew refreshCubature " +
                "to build it at commit ${pin.commit}.")
        }
        def found = sha256Of(jar)
        if (found != pin.sha256) {
            throw new GradleException("${jar} has sha256 ${found}; platform.json pins ${pin.sha256}. Run " +
                "./gradlew refreshCubature to build the pinned commit, or record the new commit and hash in " +
                "platform.json.")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyCubature' }

// Builds the Cubature JAR for pins/ at the commit platform.json pins (-PcubatureCommit to move the pin),
// from the sibling checkout (or -PcubatureCheckout), in a worktree of that checkout that is removed after:
// what the checkout has out or changed plays no part. The commit's own compile-only inputs are fetched
// into the worktree and named to its build. Prints the commit, JAR name and hash to record in platform.json.
tasks.register('refreshCubature') {
    def pin = platform.cubature
    def named = providers.gradleProperty('cubatureCheckout').map { file(it) }
    def root = rootDir
    def wanted = providers.gradleProperty('cubatureCommit').getOrElse(pin.commit)
    def scratch = layout.buildDirectory.dir('cubature-pin').get().asFile
    def javaHome = System.getProperty('java.home')
    def pins = file('pins')
    doLast {
        // The sibling of the main checkout, wherever this worktree of Quadrature sits.
        def common = new ProcessBuilder('git', '-C', root.path, 'rev-parse', '--path-format=absolute', '--git-common-dir')
            .start()
        def commonDir = common.inputStream.text.trim()
        def checkout = named.getOrElse(new File(common.waitFor() == 0 ? new File(commonDir).parentFile : root, '../Cubature')
            .canonicalFile)
        def run = { List command, File directory, File log, Map<String, String> environment ->
            def builder = new ProcessBuilder(command*.toString()).directory(directory).redirectErrorStream(true)
            builder.redirectOutput(ProcessBuilder.Redirect.appendTo(log))
            builder.environment().putAll(environment)
            // Riven's tools export this; an older Cubature build would read Riven's dev/pins through it.
            builder.environment().remove('RIVEN_WORKSPACE')
            def code = builder.start().waitFor()
            if (code != 0) {
                throw new GradleException("${command.join(' ')} failed in ${directory} (exit ${code}); see ${log}")
            }
        }
        def git = { Object... arguments ->
            // Long paths on: a sibling's deepest files can pass Windows' 260-character limit in a worktree.
            def command = (['git', '-c', 'core.longpaths=true', '-C', checkout.path] + arguments.toList())*.toString()
            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def text = process.inputStream.text.trim()
            [process.waitFor(), text]
        }
        def (found, commit) = git('rev-parse', '--verify', "${wanted}^{commit}")
        if (found != 0) {
            throw new GradleException("${checkout} has no commit ${wanted}: fetch it there first.")
        }
        // A folder per run: Windows can hold a just-built tree's files for a while (an indexer, a scanner), so one
        // that cannot be removed yet is left for a later run to sweep and blocks nothing.
        scratch.listFiles()?.findAll { it.isDirectory() }?.each { it.deleteDir() }
        git('worktree', 'prune')
        def work = new File(scratch, "${commit.take(12)}-${ProcessHandle.current().pid()}")
        def drop = {
            if (work.exists()) { git('worktree', 'remove', '--force', work.path) }
            git('worktree', 'prune')
            if (work.exists() && !work.deleteDir()) { logger.lifecycle("Could not remove ${work} yet; a later run sweeps it.") }
        }
        scratch.mkdirs()
        def log = new File(scratch, "${commit.take(12)}.log")
        log.text = ''
        def (added, addText) = git('worktree', 'add', '--detach', work.path, commit)
        if (added != 0) { throw new GradleException("git worktree add failed: ${addText}") }
        try {
            def gradlew = new File(work, "cleanroom/${System.getProperty('os.name').startsWith('Windows') ? 'gradlew.bat' : 'gradlew'}")
            def inputs = new File(work, 'cleanroom/build-inputs')
            run(['python', '-B', 'tools/fetch_build_inputs.py', '--target', inputs.path], work, log, [:])
            run([gradlew.path, 'assemble', '--no-daemon', '--no-watch-fs', '--console=plain',
                 "-Porg.gradle.java.installations.paths=${javaHome}", "-PcubicBuildInputs=${inputs.path}"],
                new File(work, 'cleanroom'), log, [JAVA_HOME: javaHome])
            def built = new File(work, 'cleanroom/build/cleanroom/libs').listFiles()
                .findAll { it.name ==~ /Cubature-.+-cleanroom\.jar/ }
            if (built.size() != 1) { throw new GradleException("Expected one Cubature JAR in the build, found ${built}") }
            // Cubature names its JAR by version alone; the pin's copy carries the commit it was built from.
            def version = (built[0].name =~ /^Cubature-(.+)-cleanroom\.jar$/)[0][1]
            def name = "Cubature-${version}-${commit.take(8)}-cleanroom.jar"
            def jar = new File(pins, name)
            pins.mkdirs()
            java.nio.file.Files.copy(built[0].toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            def hash = sha256Of(jar)
            logger.lifecycle("Built ${jar}\n  commit ${commit}\n  jar ${name}\n  sha256 ${hash}")
            logger.lifecycle(commit == pin.commit && hash == pin.sha256 && name == pin.jar ? 'This is what platform.json pins.'
                : "platform.json pins ${pin.jar} at commit ${pin.commit}, sha256 ${pin.sha256}: record the values above " +
                    'there to build against this JAR.')
        } finally {
            drop()
        }
    }
}

def constantsDirectory = layout.buildDirectory.dir('generated/sources/quadrature')
tasks.register('generateModConstants') {
    inputs.properties(modVersion: project.version, cleanroomVersion: cleanroom_version,
        graphics: platform.graphics.toString())
    outputs.dir(constantsDirectory)
    doLast {
        def destination = constantsDirectory.get().file('cc/orthrus/quadrature/QuadratureBuild.java').asFile
        destination.parentFile.mkdirs()
        destination.setText("""package cc.orthrus.quadrature;

/** Build constants generated from gradle.properties and platform.json. */
final class QuadratureBuild {
    static final String VERSION = \"${project.version}\";
    static final String CLEANROOM = \"${cleanroom_version}\";
    static final String GRAPHICS_VENDOR = \"${platform.graphics.vendor}\";
    static final long MINIMUM_GPU_MEMORY_MIB = ${platform.graphics.minimumMemoryMiB}L;
    static final int DRIVER_FLOOR_BRANCH = ${platform.graphics.driver.floorBranch};
    static final int DRIVER_WARN_BELOW_BRANCH = ${platform.graphics.driver.warnBelowBranch};
    static final String[] DRIVER_KNOWN_BAD = {${platform.graphics.driver.knownBad.collect { '"' + it + '"' }.join(', ')}};
    private QuadratureBuild() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(constantsDirectory)
tasks.named('compileJava') { dependsOn 'generateModConstants' }
tasks.named('sourcesJar') { dependsOn 'generateModConstants' }

processResources {
    inputs.properties(version: project.version, cleanroom: cleanroom_version)
    filesMatching('mcmod.info') {
        expand(version: project.version, cleanroom: cleanroom_version)
    }
}

jar {
    // One runtime JAR: the Minecraft host plus the Minecraft-free core, and the bridge to OrthLib, which loads
    // only where OrthLib is installed.
    from(project(':core').sourceSets.main.output)
    from(sourceSets.orthlib.output)
    manifest.attributes('ModType': 'CRL', 'Implementation-Title': 'Quadrature',
        'Implementation-Version': project.version, 'Quadrature-Platform': platform.id,
        // CleanMix registers Quadrature's Mixin configuration before the game's classes load.
        'MixinConnector': 'cc.orthrus.quadrature.mixin.QuadratureMixinConnector',
        // The loading plugin registers the call rewriter; the same JAR also holds the mod.
        'FMLCorePlugin': 'cc.orthrus.quadrature.asm.QuadratureLoadingPlugin',
        'FMLCorePluginContainsFMLMod': 'true')
    from(files('LICENSE', 'NOTICE.md')) { into 'META-INF' }
}

sourcesJar {
    from(project(':core').sourceSets.main.allSource)
    from(sourceSets.orthlib.allSource)
    from(files('LICENSE', 'NOTICE.md')) { into 'META-INF' }
}

tasks.named('check') { dependsOn ':core:check' }

cleanroom {
    runs {
        // Without loadsall the mod's classes load outside Cleanroom's class loader in a dev run,
        // and Forge then never matches the mod's event handler methods to the events it sends.
        client {
            configure {
                maxHeapSize = '8G'
                systemProperty 'foundation.loadsall', 'true'
                // A development run loads the mod from class folders, which have no manifest to name the
                // Mixin connector; Cleanroom takes the configuration from this property instead.
                systemProperty 'crl.dev.mixin', 'quadrature.mixins.json'
                // -PtestMemoryFloorMiB=<n> raises the GPU memory floor so the stop screen can be exercised.
                if (project.hasProperty('testMemoryFloorMiB')) {
                    systemProperty 'quadrature.test.minimumGpuMemoryMiB', project.property('testMemoryFloorMiB')
                }
                // -PdevWorld=<seconds> enters a development world unattended, logs stage times and quits.
                if (project.hasProperty('devWorld')) {
                    systemProperty 'quadrature.dev.autoWorld', 'true'
                    systemProperty 'quadrature.dev.exitAfterSeconds', project.property('devWorld')
                    systemProperty 'quadrature.frameLog', 'true'
                }
                // A development run has no manifest to name the loading plugin either.
                systemProperty 'fml.coreMods.load', 'cc.orthrus.quadrature.asm.QuadratureLoadingPlugin'
                // The development client has no Cubature, so terrain is the game's; reversed depth is on, the
                // default (D17), unless -PconventionalDepth.
                systemProperty 'quadrature.terrain', 'game'
                if (project.hasProperty('conventionalDepth')) {
                    systemProperty 'quadrature.reversedDepth', 'false'
                }
                // -PdepthSelfTest checks the projection translations against the driver as reversed depth starts.
                if (project.hasProperty('depthSelfTest')) {
                    systemProperty 'quadrature.depthSelfTest', 'true'
                }
                // -Pprobe=offscreen|visible runs a development stage of Quadrature's own inside the world pass.
                if (project.hasProperty('probe')) {
                    systemProperty 'quadrature.probe', project.property('probe')
                }
                // -Pcapabilities logs the context's limits and extensions at startup and writes them to
                // the client's quadrature-capabilities.txt.
                if (project.hasProperty('capabilities')) {
                    systemProperty 'quadrature.capabilities', 'true'
                }
                // -PstateAudit reads OpenGL state at every stage boundary and reports what each stage leaves.
                if (project.hasProperty('stateAudit')) {
                    systemProperty 'quadrature.stateAudit', 'true'
                }
            }
        }
    }
}

plugins { id 'java-library' }

// The bridge to NVIDIA's RTX runtimes (D19, D21). Its terms are set by Orthrus Research and are still
// pending (NOTICE.md); the Apache License of the rest of Quadrature does not cover it. No NVIDIA SDK
// material is in it. It brings its own Vulkan binding, LWJGL's, at the LWJGL release Cleanroom ships
// (platform.json), embedded in its JAR, since Cleanroom's LWJGL has none.
group = rootProject.group
version = rootProject.version
base.archivesName = 'quadrature-nvidia'

def lwjgl = rootProject.platform.cleanroom.lwjgl
// LWJGL's native library for the system the tests run on.
def lwjglNatives = {
    def system = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arm = System.getProperty('os.arch') in ['aarch64', 'arm64']
    def name = system.startsWith('windows') ? 'windows' : system.startsWith('mac') ? 'macos' : 'linux'
    "natives-${name}${arm ? '-arm64' : ''}"
}()

configurations {
    // The Vulkan binding travels inside the module's JAR; nothing else does.
    embedded { transitive = false }
    implementation.extendsFrom(embedded)
}

dependencies {
    // The seam the host calls through. Core ships in Quadrature's own JAR and reaches the module through
    // the game's class loader, so it is not packed here.
    compileOnly project(':core')
    // Cleanroom supplies LWJGL's core and its OpenGL binding at run time.
    compileOnly "org.lwjgl:lwjgl:${lwjgl}"
    compileOnly "org.lwjgl:lwjgl-opengl:${lwjgl}"
    embedded "org.lwjgl:lwjgl-vulkan:${lwjgl}"
    // The module is Windows-only, as its Win32 handles are, but its tests need no GPU and no Windows: only
    // LWJGL's memory functions, which need its native library for the system running them.
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.lwjgl:lwjgl:${lwjgl}"
    testRuntimeOnly "org.lwjgl:lwjgl:${lwjgl}:${lwjglNatives}"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}

// The LWJGL release the binding was built against, compared at run time with the core LWJGL the game
// loaded: modules of two releases do not work together.
def constants = layout.buildDirectory.dir('generated/sources/nvidia')
tasks.register('generateBindingRelease') {
    inputs.property('lwjgl', lwjgl)
    outputs.dir(constants)
    doLast {
        def destination = constants.get().file('cc/orthrus/quadrature/nvidia/BindingRelease.java').asFile
        destination.parentFile.mkdirs()
        destination.setText("""package cc.orthrus.quadrature.nvidia;

/** The LWJGL release of the embedded Vulkan binding, from platform.json. Generated by the build. */
final class BindingRelease {
    static final String LWJGL = \"${lwjgl}\";
    private BindingRelease() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(constants)
tasks.named('compileJava') { dependsOn 'generateBindingRelease' }

// The NGX shim (D19): NGX's entry points come as a static library, so a small DLL of the module's own links them
// and the Java side calls it through the Foreign Function and Memory API. It is built only on request, against a
// DLSS SDK the builder names with -PdlssSdk=<folder> and Vulkan headers from VULKAN_SDK (or -PvulkanSdk), with
// clang-cl (or -PnativeCompiler). It lands in build/native and never in the JAR; the handoff loads it from a path.
def shimSource = file('src/main/native/ngx_shim.cpp')
def shimOut = layout.buildDirectory.dir('native')
tasks.register('ngxShim', Exec) {
    group = 'build'
    description = 'Builds the NGX shim, quadrature_ngx.dll, against the DLSS SDK named by -PdlssSdk.'
    def sdk = providers.gradleProperty('dlssSdk')
    def vulkanSdk = providers.gradleProperty('vulkanSdk').orElse(providers.environmentVariable('VULKAN_SDK'))
    def compiler = providers.gradleProperty('nativeCompiler').orElse('clang-cl')
    inputs.file(shimSource)
    inputs.property('dlssSdk', sdk.orElse(''))
    inputs.property('vulkanSdk', vulkanSdk.orElse(''))
    outputs.dir(shimOut)
    workingDir shimOut
    doFirst {
        if (!sdk.present) {
            throw new GradleException('ngxShim needs -PdlssSdk=<the DLSS SDK folder>; the SDK never enters this tree (D19).')
        }
        if (!vulkanSdk.present) {
            throw new GradleException('ngxShim needs the Vulkan headers: set VULKAN_SDK or pass -PvulkanSdk=<folder>.')
        }
        def root = file(sdk.get())
        def library = new File(root, 'lib/Windows_x86_64/x64/nvsdk_ngx_d.lib')
        if (!library.isFile()) {
            throw new GradleException("The DLSS SDK at -PdlssSdk has no lib/Windows_x86_64/x64/nvsdk_ngx_d.lib.")
        }
        shimOut.get().asFile.mkdirs()
        // NGX's library is built against the dynamic C runtime (/MD); its registry and window lookups need
        // advapi32 and user32. NGX is handed the loader's lookups, so nothing links the Vulkan loader.
        commandLine compiler.get(), '/nologo', '/LD', '/MD', '/O2', '/EHsc', '/std:c++17', '/W3', '-Wno-missing-braces',
            "/I${new File(root, 'include')}", "/I${new File(vulkanSdk.get(), 'Include')}", shimSource.absolutePath,
            '/Fequadrature_ngx.dll', '/link', library.absolutePath, 'advapi32.lib', 'user32.lib'
    }
}

jar {
    // The binding's classes. Its only versioned entry is its module descriptor, and its macOS entries are
    // checksums of a native library this module never loads.
    from({ configurations.embedded.collect { zipTree(it) } }) {
        exclude 'META-INF/**', '**/module-info.class'
    }
    from(files('NOTICE.md')) { into 'META-INF' }
    manifest.attributes('Implementation-Title': 'Quadrature NVIDIA bridge', 'Implementation-Version': project.version)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

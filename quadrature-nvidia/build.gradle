plugins { id 'java-library' }

// The bridge to NVIDIA's RTX runtimes (D19, D21). Its terms are set by Orthrus Research and are still
// pending (NOTICE.md); the Apache License of the rest of Quadrature does not cover it. No NVIDIA SDK
// material is in it. It brings its own Vulkan binding, LWJGL's, at the LWJGL release Cleanroom ships
// (platform.json), embedded in its JAR, since Cleanroom's LWJGL has none.
group = rootProject.group
version = rootProject.version
base.archivesName = 'quadrature-nvidia'

def lwjgl = rootProject.platform.cleanroom.lwjgl

configurations {
    // The Vulkan binding travels inside the module's JAR; nothing else does.
    embedded { transitive = false }
    implementation.extendsFrom(embedded)
}

dependencies {
    // The seam the host calls through. Core ships in Quadrature's own JAR and reaches the module through
    // the game's class loader, so it is not packed here.
    compileOnly project(':core')
    // Cleanroom supplies LWJGL's core and its OpenGL binding at run time.
    compileOnly "org.lwjgl:lwjgl:${lwjgl}"
    compileOnly "org.lwjgl:lwjgl-opengl:${lwjgl}"
    embedded "org.lwjgl:lwjgl-vulkan:${lwjgl}"
    // The module's tests need no GPU, but LWJGL's memory functions need its native library; the module is
    // Windows-only, as its Win32 handles are.
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.lwjgl:lwjgl:${lwjgl}"
    testRuntimeOnly "org.lwjgl:lwjgl:${lwjgl}:natives-windows"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}

// The LWJGL release the binding was built against, compared at run time with the core LWJGL the game
// loaded: modules of two releases do not work together.
def constants = layout.buildDirectory.dir('generated/sources/nvidia')
tasks.register('generateBindingRelease') {
    inputs.property('lwjgl', lwjgl)
    outputs.dir(constants)
    doLast {
        def destination = constants.get().file('cc/orthrus/quadrature/nvidia/BindingRelease.java').asFile
        destination.parentFile.mkdirs()
        destination.setText("""package cc.orthrus.quadrature.nvidia;

/** The LWJGL release of the embedded Vulkan binding, from platform.json. Generated by the build. */
final class BindingRelease {
    static final String LWJGL = \"${lwjgl}\";
    private BindingRelease() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(constants)
tasks.named('compileJava') { dependsOn 'generateBindingRelease' }

jar {
    // The binding's classes. Its only versioned entry is its module descriptor, and its macOS entries are
    // checksums of a native library this module never loads.
    from({ configurations.embedded.collect { zipTree(it) } }) {
        exclude 'META-INF/**', '**/module-info.class'
    }
    from(files('NOTICE.md')) { into 'META-INF' }
    manifest.attributes('Implementation-Title': 'Quadrature NVIDIA bridge', 'Implementation-Version': project.version)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

# Quadrature's checks, in the shared actions format. Workbench runs them from a clean clone on Temurin 26.0.2.1+1
# (`wb run ci.run project=quadrature`), with {python} the environment made from tools/requirements.txt, keeps the
# passes, and its pre-push hook refuses a commit whose tree has not passed every ci job. Nothing here starts the game
# or needs a GPU: game runs are Workbench plans of lab routines.
#
# OrthLib and Cubature are checkouts the build only takes pinned commits from: platform.json pins each JAR by
# commit and SHA-256, and the build makes it in a worktree of the checkout at that commit, or takes it from
# Workbench's pin cache (WB_PIN_CACHE). Their own trees are not what a run tests.

[settings]
name = "quadrature"
workflow = "ci"
identity_files = ["{env.JAVA_HOME}/release"]

[repositories.orthlib]
path = "../OrthLib"
tested = false

[repositories.cubature]
path = "../Cubature"
tested = false

[placeholders]
pins = "{run_dir}/pins"

[workflows]
ci = ["build", "mixins", "shaders", "tools"]

[jobs.build]
description = "Put the pinned OrthLib and Cubature JARs in place, then build Quadrature and run every module's tests"
locks = ["gradle"]
memory = 6
steps = [
  { name = "pins", run = ["bash", "gradlew", "refreshOrthLib", "refreshCubature", "--no-daemon", "--console=plain", "-PpinsDir={pins}", "-PorthlibCheckout={orthlib}", "-PcubatureCheckout={cubature}", "-Ppython={python}"] },
  { name = "build", run = ["bash", "gradlew", "build", "--no-daemon", "--console=plain", "-PpinsDir={pins}"] },
]

[jobs.mixins]
description = "Apply Quadrature's Mixins to the game's classes offline with OrthLib's mixinkit, strictly, by development names and through the shipped jar's refmap by production names, and refuse @Shadow (tools/mixin_check.py)"
needs = ["build"]
locks = ["gradle"]
memory = 4
steps = [
  { name = "mixinkit", run = ["bash", "gradlew", ":mixinkit:jar", "--no-daemon", "--console=plain"], cwd = "{orthlib}" },
  { name = "mixin check", run = ["{python}", "-B", "tools/mixin_check.py", "--refmap", "--out", "{run_dir}/mixin-report.txt"], env = { ORG_GRADLE_PROJECT_pinsDir = "{pins}" } },
]

[jobs.shaders]
description = "Write every GLSL stage the mod's classes hold and compile each with glslang"
needs = ["build"]
locks = ["gradle"]
steps = [
  { name = "glslang", run = ["bash", "gradlew", "validateShaders", "--no-daemon", "--console=plain", "-PpinsDir={pins}", "-PshaderDir={run_dir}/glsl"] },
]

[jobs.tools]
description = "The Python tool tests, under {python}"
inputs = ["tools/*.py", "tools/tests/*.py", "tools/requirements.txt"]
steps = [
  { name = "unittest", run = ["{python}", "-B", "-m", "unittest", "discover", "-s", "tools/tests", "-p", "test_*.py"] },
]

[[quick.quadrature]]
paths = ["docs/**", "*.md", "LICENSE", "NOTICE.md", "quadrature-nvidia/NOTICE.md"]
jobs = []

[[quick.quadrature]]
paths = ["tools/shaders/**"]
jobs = ["shaders"]

[[quick.quadrature]]
paths = ["tools/mixin_check.py"]
jobs = ["mixins", "tools"]

[[quick.quadrature]]
paths = ["tools/**"]
jobs = ["tools"]

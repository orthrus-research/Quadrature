# Block kinds for the per-state material table. Revision 4 of 2026-11-16.
# A line is block.<kind>= followed by block names; name:property=value names the states of a block
# with that property value; further :property=value may follow, and all must match.
# Kinds: 100 water; 101 lava; 110 leaves; 111 single plants and saplings; 112 tall plants, lower half;
# 113 tall plants, upper half; 114 hanging plants; 115 floating plants; 116 stiff thin plants and
# fungi; 117 submerged plants; 118 ground cover; 120 dim emitters; 121 bright emitters; 130 glass;
# 131 ice; 140 metals; 199 plain: the defaults and no emission whatever light the block gives, named
# so that no rule gives it a kind.
